<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2e38">
<title>Evolução Pós-Operatória</title>
<style>
  :root{
    --ink:#0f2e38;--ink-2:#294a54;--line:#d6e0e2;--bg:#eaf0f1;--surface:#ffffff;
    --accent:#0d6b62;--muted:#5c7078;--sel:#0f2e38;--radius:12px;--tap:48px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.45;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;letter-spacing:.2px;font-weight:650}
  header p{margin:2px 0 0;font-size:12.5px;color:#a9c6cb}
  main{max-width:640px;margin:0 auto;padding:0 14px}

  .beds{display:flex;gap:8px;padding:14px 0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bed{flex:0 0 auto;min-width:64px;height:60px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;color:var(--muted);gap:2px;position:relative}
  .bed .n{font-size:20px;font-weight:700;line-height:1;color:var(--ink)}
  .bed .lbl{font-size:10px;letter-spacing:.3px}
  .bed[aria-selected="true"]{border-color:var(--ink);background:var(--ink)}
  .bed[aria-selected="true"] .n,.bed[aria-selected="true"] .lbl{color:#fff}
  .bed .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0}
  .bed.filled .dot{opacity:1}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:8px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  label.lab{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
  input[type="text"],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:var(--tap)}
  textarea{min-height:70px;resize:vertical;line-height:1.4}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,107,98,.15)}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row-po{display:grid;grid-template-columns:92px 1fr;gap:10px}

  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:88px;min-height:var(--tap);border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
  .seg.sx button{font-weight:700;min-width:0}

  .sub{margin-top:10px;padding:12px;border-left:3px solid var(--accent);background:#f2f8f7;border-radius:0 10px 10px 0}
  .sub .field{margin-bottom:12px}
  .sub .field:last-child,.sub .row2 .field{margin-bottom:0}

  .genbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(#eaf0f1cc,#eaf0f1);padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);backdrop-filter:blur(6px)}
  .genbar .inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
  .btn{min-height:52px;border-radius:12px;border:none;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .btn.primary{flex:1;background:var(--accent);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:0 16px}
  .btn:active{transform:translateY(1px)}

  .result{margin-top:12px}
  .result h2{font-size:13px;margin:0 0 8px;color:var(--ink-2)}
  #resumo{width:100%;min-height:170px;font-size:15px;line-height:1.5;border:1.5px solid var(--accent);border-radius:10px;padding:12px;background:#f7fbfa}
  .actions{display:flex;gap:10px;margin-top:10px}
  .actions .btn{flex:1}
  .actions .btn.copy{background:var(--ink);color:#fff}
  .actions .btn.mail{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  details.cfg{margin-top:12px;font-size:13px;color:var(--muted)}
  details.cfg summary{cursor:pointer;padding:6px 0}
  details.cfg input{margin-top:6px}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Evolução Pós-Operatória</h1>
  <p>Enfermaria · Aptos 1 a 5 · dados salvos apenas neste aparelho</p>
</header>

<main>
  <div class="beds" id="beds" role="tablist" aria-label="Selecionar leito"></div>
  <div id="form"></div>

  <div class="result" id="resultWrap" style="display:none">
    <h2>Resumo da visita (edite se precisar antes de copiar)</h2>
    <textarea id="resumo" spellcheck="true"></textarea>
    <div class="actions">
      <button class="btn copy" id="btnCopy">Copiar</button>
      <button class="btn mail" id="btnMail">Enviar por e-mail</button>
    </div>
    <p class="hint">No computador do serviço: abra o e-mail e cole o texto direto no prontuário.</p>
  </div>

  <details class="cfg">
    <summary>E-mail de destino (opcional)</summary>
    <input type="text" id="destEmail" inputmode="email" placeholder="seuemail@exemplo.com" autocomplete="email">
  </details>
</main>

<div class="genbar">
  <div class="inner">
    <button class="btn ghost" id="btnClear">Limpar</button>
    <button class="btn primary" id="btnGen">Gerar resumo</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var STORE="evolucao_posop_v2";

  function blank(){return{
    nome:"",prontuario:"",sexo:"",posop:"",cirurgia:"",
    acompanhante:"",acompNome:"",acompParentesco:"",
    drenos:"",drenoFuncao:"",drenoSecrecao:"",
    svd:"",diurese:"",alimentacao:"",nvpo:"",
    algicas:"",algiaLocal:"",conduta:"",notas:""
  };}

  var state={current:1,destEmail:"",aptos:{}};
  for(var i=1;i<=5;i++)state.aptos[i]=blank();

  function load(){
    try{var raw=localStorage.getItem(STORE);if(raw){var d=JSON.parse(raw);
      if(d&&d.aptos){for(var k=1;k<=5;k++){var a=d.aptos[k]||{};var b=blank();for(var f in b){if(a[f]!=null)b[f]=a[f];}state.aptos[k]=b;}}
      if(d.destEmail)state.destEmail=d.destEmail;
      if(d.current)state.current=d.current;
    }}catch(e){}
  }
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

  var $=function(id){return document.getElementById(id);};
  var formEl=$("form"),bedsEl=$("beds");

  function renderBeds(){
    bedsEl.innerHTML="";
    for(var n=1;n<=5;n++){(function(n){
      var b=document.createElement("button");
      b.className="bed"+(state.aptos[n].nome.trim()?" filled":"");
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected",state.current===n?"true":"false");
      b.innerHTML='<span class="n">'+n+'</span><span class="lbl">Apto</span><span class="dot"></span>';
      b.onclick=function(){state.current=n;save();renderBeds();renderForm();hideResult();};
      bedsEl.appendChild(b);
    })(n);}
  }

  function seg(opts,current,onpick){
    var wrap=document.createElement("div");wrap.className="seg"+(opts.join()==="M,F"?" sx":"");
    opts.forEach(function(opt){
      var btn=document.createElement("button");btn.type="button";btn.textContent=opt;
      btn.setAttribute("aria-pressed",current===opt?"true":"false");
      btn.onclick=function(){
        var val=(current===opt)?"":opt;
        [].forEach.call(wrap.children,function(c){c.setAttribute("aria-pressed",c.textContent===val?"true":"false");});
        onpick(val);
      };
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function textField(label,key,val,ph){
    var f=document.createElement("div");f.className="field";
    var l=document.createElement("label");l.className="lab";l.textContent=label;f.appendChild(l);
    var inp=document.createElement("input");inp.type="text";inp.value=val;inp.placeholder=ph||"";
    inp.oninput=function(){state.aptos[state.current][key]=inp.value;save();if(key==="nome")markBed();};
    f.appendChild(inp);return f;
  }
  function areaField(label,key,val,ph){
    var f=document.createElement("div");f.className="field";
    var l=document.createElement("label");l.className="lab";l.textContent=label;f.appendChild(l);
    var ta=document.createElement("textarea");ta.value=val;ta.placeholder=ph||"";
    ta.oninput=function(){state.aptos[state.current][key]=ta.value;save();};
    f.appendChild(ta);return f;
  }
  function labeledSeg(label,key,opts){
    var p=state.aptos[state.current];
    var f=document.createElement("div");f.className="field";
    var l=document.createElement("label");l.className="lab";l.textContent=label;f.appendChild(l);
    f.appendChild(seg(opts,p[key],function(v){p[key]=v;save();}));
    return f;
  }
  function plainToggle(key,label,opts){
    var p=state.aptos[state.current];
    var f=document.createElement("div");f.className="field";
    var l=document.createElement("label");l.className="lab";l.textContent=label;f.appendChild(l);
    f.appendChild(seg(opts,p[key],function(v){p[key]=v;save();}));
    return f;
  }
  function revealToggle(key,label,opts,openWhenSim,buildSub){
    var p=state.aptos[state.current];
    var f=document.createElement("div");f.className="field";
    var l=document.createElement("label");l.className="lab";l.textContent=label;f.appendChild(l);
    f.appendChild(seg(opts,p[key],function(v){p[key]=v;save();renderForm();}));
    if(p[key]===openWhenSim){
      var sub=document.createElement("div");sub.className="sub";
      buildSub(sub,p);
      f.appendChild(sub);
    }
    return f;
  }

  function renderForm(){
    var p=state.aptos[state.current];
    formEl.innerHTML="";
    var card=document.createElement("div");card.className="card";

    card.appendChild(textField("Nome","nome",p.nome,"Nome do paciente"));

    var row=document.createElement("div");row.className="row2";
    row.appendChild(textField("Prontuário","prontuario",p.prontuario,"Nº do prontuário"));
    row.appendChild(labeledSeg("Sexo","sexo",["M","F"]));
    card.appendChild(row);

    var poRow=document.createElement("div");poRow.className="row-po";
    poRow.appendChild(textField("Pós-operatório","posop",p.posop,"Ex.: POI, PO1"));
    poRow.appendChild(textField("Cirurgia","cirurgia",p.cirurgia,"(descreva a cirurgia)"));
    card.appendChild(poRow);

    card.appendChild(revealToggle("acompanhante","Acompanhante",["Sim","Não"],"Sim",function(sub){
      var r=document.createElement("div");r.className="row2";
      r.appendChild(textField("Nome do acompanhante","acompNome",p.acompNome,"Nome"));
      r.appendChild(textField("Parentesco","acompParentesco",p.acompParentesco,"Ex.: esposa, filho"));
      sub.appendChild(r);
    }));

    card.appendChild(revealToggle("drenos","Drenos",["Sim","Não"],"Sim",function(sub){
      var f1=document.createElement("div");f1.className="field";
      var l1=document.createElement("label");l1.className="lab";l1.textContent="Funcionamento";f1.appendChild(l1);
      f1.appendChild(seg(["Funcionante","Não funcionante"],p.drenoFuncao,function(v){p.drenoFuncao=v;save();}));
      sub.appendChild(f1);
      var f2=document.createElement("div");f2.className="field";
      var l2=document.createElement("label");l2.className="lab";l2.textContent="Secreção";f2.appendChild(l2);
      f2.appendChild(seg(["Hemática","Serohemática","Hialina"],p.drenoSecrecao,function(v){p.drenoSecrecao=v;save();}));
      sub.appendChild(f2);
    }));

    card.appendChild(plainToggle("svd","SVD",["Sim","Não"]));
    card.appendChild(plainToggle("diurese","Diurese",["Presente","Ausente"]));
    card.appendChild(plainToggle("alimentacao","Alimentação",["Normal","Diminuída"]));
    card.appendChild(plainToggle("nvpo","NVPO",["Sim","Não"]));

    card.appendChild(revealToggle("algicas","Queixas álgicas",["Sim","Não"],"Sim",function(sub){
      var f=document.createElement("div");f.className="field";
      var l=document.createElement("label");l.className="lab";l.textContent="Localização";f.appendChild(l);
      var ta=document.createElement("textarea");ta.value=p.algiaLocal;ta.placeholder="Descreva onde";
      ta.oninput=function(){p.algiaLocal=ta.value;save();};
      f.appendChild(ta);sub.appendChild(f);
    }));

    card.appendChild(areaField("Conduta","conduta",p.conduta,"Conduta adotada nesta visita"));
    card.appendChild(areaField("Notas","notas",p.notas,"Descrição livre"));
    formEl.appendChild(card);
  }

  function markBed(){
    var b=bedsEl.children[state.current-1];if(!b)return;
    if(state.aptos[state.current].nome.trim())b.classList.add("filled");else b.classList.remove("filled");
  }

  // ---- Gerador do resumo (roda no aparelho) ----
  function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
  function stripDot(s){return s.replace(/[.\s]+$/,"");}

  function build(n){
    var p=state.aptos[n];
    var head=[];
    head.push(p.nome.trim()||"Paciente");

    var po="";
    if(p.posop.trim()&&p.cirurgia.trim())po=p.posop.trim()+" de "+p.cirurgia.trim();
    else if(p.posop.trim())po=p.posop.trim();
    else if(p.cirurgia.trim())po="pós-operatório de "+p.cirurgia.trim();
    if(po)head.push(po);

    head.push("em leito de apartamento");

    if(p.acompanhante==="Sim"){
      var det=[];
      if(p.acompNome.trim())det.push(p.acompNome.trim());
      if(p.acompParentesco.trim())det.push(p.acompParentesco.trim());
      head.push("com seu acompanhante"+(det.length?" ("+det.join(", ")+")":""));
    }else if(p.acompanhante==="Não"){
      head.push("sem acompanhante");
    }

    var status=[];
    if(p.drenos==="Sim"){
      var d="com dreno(s)";
      if(p.drenoFuncao)d+=", "+(p.drenoFuncao==="Funcionante"?"funcionante":"não funcionante");
      if(p.drenoSecrecao)d+=", secreção "+p.drenoSecrecao.toLowerCase();
      status.push(d);
    }else if(p.drenos==="Não"){status.push("sem drenos");}
    if(p.svd)status.push(p.svd==="Sim"?"com SVD":"sem SVD");
    if(p.diurese)status.push(p.diurese==="Presente"?"diurese presente":"diurese ausente");
    if(p.alimentacao)status.push(p.alimentacao==="Normal"?"aceitando dieta normalmente":"com aceitação diminuída da dieta");
    if(status.length)head.push("no momento "+status.join(", "));

    var evo=head.join(", ")+".";

    var sym=[];
    if(p.nvpo)sym.push(p.nvpo==="Sim"?"apresenta náuseas e/ou vômitos pós-operatórios":"nega náuseas ou vômitos pós-operatórios");
    if(p.algicas==="Sim"){
      sym.push("refere queixas álgicas"+(p.algiaLocal.trim()?" em "+p.algiaLocal.trim():""));
    }else if(p.algicas==="Não"){sym.push("nega queixas álgicas");}
    if(sym.length)evo+="\n"+cap(sym.join(", "))+".";

    if(p.conduta.trim())evo+="\n\nCD: "+stripDot(p.conduta.trim())+".";
    if(p.notas.trim())evo+="\n\n\n## Notas\n"+p.notas.trim();

    return evo;
  }

  var resultWrap=$("resultWrap"),resumoEl=$("resumo");
  function hideResult(){resultWrap.style.display="none";}
  function showResult(txt){resumoEl.value=txt;resultWrap.style.display="block";resultWrap.scrollIntoView({behavior:"smooth",block:"nearest"});}
  function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1600);}

  $("btnGen").onclick=function(){showResult(build(state.current));};
  $("btnClear").onclick=function(){
    if(!confirm("Limpar todos os dados do Apto "+state.current+"?"))return;
    state.aptos[state.current]=blank();save();renderForm();markBed();hideResult();
  };
  $("btnCopy").onclick=function(){
    var txt=resumoEl.value;
    function ok(){toast("Resumo copiado");}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fallback);}else fallback();
    function fallback(){resumoEl.focus();resumoEl.select();try{document.execCommand("copy");ok();}catch(e){toast("Selecione e copie manualmente");}}
  };
  $("btnMail").onclick=function(){
    var p=state.aptos[state.current];
    var dt=new Date().toLocaleDateString("pt-BR");
    var subj="Evolução — Apto "+state.current+(p.nome.trim()?" — "+p.nome.trim():"")+" — "+dt;
    var to=state.destEmail.trim();
    window.location.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(resumoEl.value);
  };

  load();
  var destInput=$("destEmail");
  destInput.value=state.destEmail;
  destInput.oninput=function(){state.destEmail=destInput.value;save();};

  renderBeds();renderForm();
})();
</script>
</body>
</html>
